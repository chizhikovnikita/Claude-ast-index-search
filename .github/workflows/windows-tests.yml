name: Fork Workspace Tests

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "crates/**"
      - "tree-sitter-bsl/**"
      - "build.rs"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/windows-tests.yml"
  push:
    branches: [main, 'sync/**']
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "crates/**"
      - "tree-sitter-bsl/**"
      - "build.rs"
      - "scripts/**"
      - ".cargo/**"
      - ".github/workflows/windows-tests.yml"

permissions:
  contents: read

jobs:
  workspace:
    name: Release workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build release workspace
        run: cargo build --release --workspace --locked
      - name: Test push destination protection
        shell: pwsh
        run: ./scripts/test-push-guard.ps1
      - name: Test complete release workspace
        env:
          AST_INDEX_CACHE_DIR: ${{ runner.temp }}/ast-index-validation-cache
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --release --workspace --locked --no-fail-fast
